# Define the stages
stages:
    - prepare
    - build
    - deploy

# Define the variables
variables:
    PROJECT_NAME: train-board-api
    IMAGE_NAME: $AZURECR_HOST/$PROJECT_NAME
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    CI_PROJECT_DIR: kubernetes
    KUBE_CONTEXT: ljmu-set/K3S:set-lab-cluster

# Set default image and services
default:
    image: docker:24.0.5
    services:
        - docker:24.0.5-dind
    before_script:
        - until docker info; do sleep 1; done
        - echo "$AZURECR_PASSWORD" | docker login $AZURECR_HOST -u $AZURECR_USER --password-stdin

# Prepare the job
prepare:
    stage: prepare
    script:
        - export TAG=$(awk -F'[<>]' '/<version>/{print $3; exit}' pom.xml)
        - echo "TAG=$TAG" >> variables.env
    before_script: []
    services: []
    artifacts:
        reports:
            dotenv: variables.env

# Check for existing images
check:
    stage: prepare
    needs:
        - job: prepare
          artifacts: true
    script:
        - |
            # Check if the image exists locally or on Docker Hub
            if docker manifest inspect "$IMAGE_NAME:$TAG" > /dev/null 2>&1; then
                echo "Docker image $IMAGE_NAME:$TAG already exists."
                exit 1 # Fail the pipeline
            else
                echo "Docker image $IMAGE_NAME:$TAG does not exist."
                exit 0 # Pass the check stage
            fi

# Build the image for AMD64 architecture
build_amd64:
    stage: build
    needs:
        - job: check
        - job: prepare
          artifacts: true
    script:
        - docker pull "$IMAGE_NAME:latest" || true
        - docker build .
          --build-arg BUILDKIT_INLINE_CACHE=1
          --cache-from $IMAGE_NAME:latest
          --tag "$IMAGE_NAME:latest"
          --tag "$IMAGE_NAME:$TAG"
        - docker push $IMAGE_NAME:latest
        - docker push $IMAGE_NAME:$TAG
    tags:
        - saas-linux-small-amd64

# Build the image for ARM64 architecture
build_arm64:
    stage: build
    needs:
        - job: check
        - job: prepare
          artifacts: true
    script:
        - docker pull "$IMAGE_NAME:latest-arm64" || true
        - docker build .
          --build-arg BUILDKIT_INLINE_CACHE=1
          --cache-from $IMAGE_NAME:latest-arm64
          --tag "$IMAGE_NAME:latest-arm64"
          --tag "$IMAGE_NAME:$TAG-arm64"
        - docker push $IMAGE_NAME:latest-arm64
        - docker push $IMAGE_NAME:$TAG-arm64
    tags:
        - saas-linux-small-arm64

# Deploy the image to local kubernetes cluster
deploy:
    stage: deploy
    image: cylab/kubectl
    needs:
        - job: build_arm64
        - job: prepare
          artifacts: true
    services: []
    before_script: []
    script:
        # Deploy the image to the local kubernetes cluster
        - kubectl config use-context $KUBE_CONTEXT
        - kubectl apply -f $CI_PROJECT_DIR/specs/.
        - kubectl set image deployment/$PROJECT_NAME $PROJECT_NAME=$IMAGE_NAME:$TAG-arm64
        - kubectl set env deployment/$PROJECT_NAME RAILDATA_API_KEY=$API_KEY
